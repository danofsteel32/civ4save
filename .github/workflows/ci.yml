name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests
      - run: uv run --locked ruff format --check src tests
      - run: uv build
        if: ${{ !cancelled() }}

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked mypy src
      - run: uv run --locked pytest
