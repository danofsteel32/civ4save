repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
        files: ^(src|tests)/
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
        files: ^(src|tests)/
      - id: mypy
        name: mypy
        entry: uv run --locked mypy src
        language: system
        types: [python]
        files: ^(src|tests)/
        pass_filenames: false
        require_serial: true
