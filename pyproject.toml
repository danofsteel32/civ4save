[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "civ4save"
version = "0.8.0"
description = "Read Civilization IV: Beyond the Sword saves with a Python library and CLI"
readme = "README.md"
authors = [{name = "Dan Davis", email = "dan@dandavis.dev"}]
license = "GPL-3.0-only"
license-files = ["COPYING"]
classifiers = [
    "Topic :: Games/Entertainment :: Turn Based Strategy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
keywords = ["civ4", "civilization", "beyond-the-sword", "savefile", "games"]
dependencies = [
    "attrs>=26.1.0",
    "click>=8.1.8",
    "construct>=2.10.70",
    "importlib-resources>=6.5.2",
    "Jinja2>=3.1.6",
    "lazy-property>=0.0.1",
    "rich>=15.0.0",
    "xmltodict>=1.0.4",
]
requires-python = ">=3.9"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pre-commit>=4.3.0",
]

[project.urls]
Homepage = "https://github.com/danofsteel32/civ4save"
Documentation = "https://github.com/danofsteel32/civ4save#readme"
Repository = "https://github.com/danofsteel32/civ4save"
Issues = "https://github.com/danofsteel32/civ4save/issues"
Changelog = "https://github.com/danofsteel32/civ4save/releases"

[project.scripts]
civ4save = "civ4save.cli:cli"

[tool.mypy]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests/*"
disallow_untyped_defs = false

[tool.ruff]
target-version = "py39"
