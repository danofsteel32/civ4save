[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civ4save"
version = "0.7.0"
description = "Extract data from a .CivBeyondSwordSave file"
readme = "README.md"
authors = [{name = "Dan Davis", email = "dan@dandavis.dev"}]
license = { file = "COPYING" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Topic :: Games/Entertainment :: Turn Based Strategy",
]
keywords = ["civ", "civilization", "savefile", "games", ""]
dependencies = [
    "attrs",
    "click",
    "construct",
    "importlib-resources >= 5.9.0",
    "Jinja2",
    "lazy-property",
    "rich",
    "xmltodict",
]
requires-python = ">=3.9"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "tox"
]

[project.urls]
Homepage = "https://github.com/danofsteel32/civ4save"

[project.scripts]
civ4save = "civ4save.cli:cli"

[tool.mypy]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests/*"
disallow_untyped_defs = false
